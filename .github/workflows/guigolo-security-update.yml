name: Validate Guigolo security dependency update

on:
  push:
    branches:
      - fix/guigolo-security-deps-2026-10

permissions:
  contents: write

jobs:
  update-lock-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Resolve dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Update vulnerable packages within lockfile
        run: pnpm audit --fix=update
        continue-on-error: true

      - name: Verify frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(deps): regenerate pnpm lockfile"
            git push
          fi

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint (report existing component issues)
        run: pnpm lint
        continue-on-error: true

      - name: Production build
        run: pnpm build

      - name: Dependency audit (informational)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Production dependency audit (informational)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
