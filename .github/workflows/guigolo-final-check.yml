name: Guigolo final cleanup checks
on:
  push:
    branches:
      - fix/guigolo-final-lint-2026-10
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Start production server
        run: |
          pnpm start >/tmp/guigolo-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/es >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/guigolo-server.log
          exit 1
      - name: Browser setup (temporary)
        run: |
          pnpm add -D @playwright/test@1.58.2 --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          mkdir -p test-temp
          cat > test-temp/guigolo-final.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');
          test.use({baseURL:'http://127.0.0.1:3000', viewport:{width:1365,height:900}});
          test.setTimeout(60000);

          test('homepage Spanish and English, contact form renders', async ({page}) => {
            await page.goto('/es');
            await expect(page.locator('#contacto form')).toBeVisible();
            await page.getByRole('button',{name:'Cambiar idioma a inglés'}).first().click();
            await expect(page).toHaveURL(/\/en(?:\?|#|$)/);
            await expect(page.locator('#contacto form')).toBeVisible();
          });

          test('failed contact returns to the saved origin using client navigation', async ({page}) => {
            await page.addInitScript(() => {
              sessionStorage.setItem('contact_origin_v1', JSON.stringify({
                fromPath:'/es', fromHash:'#projects', fromScrollY:150,
                ctaId:'test', ts:Date.now()
              }));
            });
            await page.route('**/api/contact', route=>route.fulfill({
              status:500, contentType:'application/json', body:'{"error":"simulated"}'
            }));
            await page.goto('/es');
            const form=page.locator('#contacto form');
            await form.locator('[name=name]').fill('Prueba CI');
            await form.locator('[name=email]').fill('test@example.com');
            await form.locator('[name=message]').fill('Mensaje de prueba, no enviar');
            await form.getByRole('button',{name:/enviar/i}).click();
            await expect(page.getByRole('button',{name:'Volver a donde estaba'})).toBeVisible();
            await page.getByRole('button',{name:'Volver a donde estaba'}).click();
            await expect(page).toHaveURL(/\/es#projects$/);
          });

          test('achievements render image on unlock', async ({page})=>{
            await page.goto('/es');
            await page.waitForTimeout(3000);
            await page.evaluate(()=>{
              window.dispatchEvent(new CustomEvent('guigolo:achievement_unlocked',{
                detail:{id:'first_step',at:Date.now()}
              }));
            });
            await expect(page.locator('img[src="/achievements/first_step.svg"]').first()).toBeVisible();
          });
          EOF
          pnpm exec playwright test test-temp/guigolo-final.spec.cjs --reporter=line --workers=1
